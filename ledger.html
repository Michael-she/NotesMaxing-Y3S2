<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer ledger · notesmaxing</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
<script src="assets/ledger.js"></script>
</head>
<body>
<div class="wrap solo">
<main>
<header class="top">
  <a class="home" href="index.html">&larr; Modules</a>
  <h1>Beer ledger</h1>
  <p>Tokens each person has used through The Lovely Lady, in the chat and the problem generator, and the beers that comes to: one beer per 750 000 tokens.</p>
</header>
<p class="bank-count" id="status" aria-live="polite">Loading…</p>
<div class="tbl" id="wrap" hidden><table>
  <thead><tr><th>Person</th><th>Tokens</th><th>Requests</th><th>Beers owed</th><th>Last used</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<p id="me"></p>
</main>
</div>
<script>
(async function(){
  const statusEl = document.getElementById('status'), rows = document.getElementById('rows');
  const n = v => Math.round(v).toLocaleString();
  const mine = window.notesLedger ? notesLedger.mine() : {};
  try{
    const r = await fetch('api/ledger', {cache: 'no-store'});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const people = d.people || [];
    let sum = 0;
    for (const p of people){
      sum += p.tokens;
      const tr = document.createElement('tr');
      const last = p.last ? new Date(p.last).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '';
      [p.name, n(p.tokens), String(p.requests), p.beers.toFixed(2), last].forEach((t, i) => {
        const td = document.createElement('td'); td.textContent = t; if (i === 0 && p.name === mine.name) td.className = 'you'; tr.append(td);
      });
      rows.append(tr);
    }
    document.getElementById('wrap').hidden = !people.length;
    statusEl.textContent = people.length
      ? people.length + (people.length === 1 ? ' person' : ' people') + ' · ' + n(sum) + ' tokens · ' + (sum / d.perBeer).toFixed(2) + ' beers in all'
      : 'Nobody has used The Lovely Lady yet.';
  }catch(e){
    statusEl.textContent = 'The shared ledger could not be loaded: ' + (e.message || e);
  }
  if (mine.name) document.getElementById('me').textContent = 'This device counts your tokens as ' + mine.name + '. To change that, click your name under the chat panel.';
})();
</script>
</body>
</html>
