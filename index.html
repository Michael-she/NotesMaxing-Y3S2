<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
</head>
<body>
<div class="wrap solo">
<main>
<header class="top">
  <h1>Modules</h1>
  <p>Pick a module to see its notes and past papers.</p>
</header>

<ul class="rows" id="modules"></ul>
<noscript><p class="none">This page needs JavaScript to list the modules. The notes are in the module folders next to it.</p></noscript>
</main>
</div>

<script src="manifest.js"></script>
<script>
(function(){
  const modules = (window.NOTES_MANIFEST && window.NOTES_MANIFEST.modules) || [];
  const list = document.getElementById('modules');
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  modules.forEach(mod => {
    const a = el('a', 'row'); a.href = 'module.html?m=' + encodeURIComponent(mod.id);
    a.append(el('span', 'w', mod.code || ''), el('span', 't', mod.name),
      el('span', 'm', plural(mod.notes.length, 'note') + ' · ' + plural(mod.papers.length, 'paper')));
    const li = el('li'); li.append(a); list.append(li);
  });
  if (!modules.length){
    const p = el('p', 'none', 'No manifest found. Run '); p.append(el('code', '', 'python build_manifest.py'));
    list.replaceWith(p);
  }
})();
</script>
</body>
</html>
