<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your usage · notesmaxing</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
</head>
<body>
<div class="wrap solo">
<main>
<header class="top">
  <a class="home" href="index.html">&larr; Modules</a>
  <h1>Your usage</h1>
</header>
<p class="bank-count" id="status" aria-live="polite">Loading…</p>

<section id="mine" hidden>
<div class="tbl"><table>
  <thead><tr><th>Beers</th><th>Tokens</th><th>Messages</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
</section>

<section id="allSec" hidden>
<h2>Everyone</h2>
<p class="bank-count" id="allStatus"></p>
<div class="tbl"><table>
  <thead><tr><th>Person</th><th>Beers owed (tokens)</th><th>Messages</th><th>Page opens</th><th>Last seen</th></tr></thead>
  <tbody id="allRows"></tbody>
</table></div>
<h3>Recent requests, everyone</h3>
<div class="tbl"><table>
  <thead><tr><th>When</th><th>Person</th><th>Cost</th></tr></thead>
  <tbody id="allRecent"></tbody>
</table></div>
</section>
</main>
</div>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  const PER = 750000;
  const beerText = t => { const b = t / PER; const s = b === 0 ? '0' : b < 0.1 ? b.toFixed(3) : b < 10 ? b.toFixed(2) : b.toFixed(1); return s + (s === '1.00' ? ' beer' : ' beers'); };
  const fmt = t => beerText(t) + ' (' + Math.round(t).toLocaleString() + ' tokens)';
  const when = ts => ts ? new Date(ts).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '';
  const row = (tb, cells) => { const tr = document.createElement('tr'); cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.append(td); }); tb.append(tr); };
  let name = '';
  try{ name = localStorage.getItem('notes-user-name') || ''; }catch(e){}
  if (!name){ $('status').textContent = 'Reload the page and enter your name to see your usage.'; return; }
  try{
    const r = await fetch('api/ledger?user=' + encodeURIComponent(name), {cache: 'no-store'});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const p = d.person;
    // Everyone sees only their own totals: beers, tokens and messages.
    $('status').textContent = p.name;
    row($('rows'), [beerText(p.tokens), Math.round(p.tokens).toLocaleString(), String(p.requests)]);
    $('mine').hidden = false;

    // Only the admin's name gets everyone's usage back from the server.
    if (d.everyone){
      const all = d.everyone.people || [];
      let sum = 0, opens = 0;
      for (const q of all){ sum += q.tokens; opens += q.opens; row($('allRows'), [q.name, fmt(q.tokens), String(q.requests), String(q.opens), when(q.last)]); }
      for (const e of d.everyone.recent || []) row($('allRecent'), [when(e.timestamp), e.name, fmt(e.tokens)]);
      $('allStatus').textContent = all.length + (all.length === 1 ? ' person' : ' people') + ' · ' + fmt(sum) + ' in all · ' + opens.toLocaleString() + ' page opens';
      $('allSec').hidden = false;
    }
  }catch(e){
    $('status').textContent = 'Your usage could not be loaded: ' + (e.message || e);
  }
})();
</script>
</body>
</html>
